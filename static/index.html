<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W-Term</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <h1>W-Term</h1>
    <div id="project-list"></div>
    <div id="conn-status" class="disconnected">연결 안 됨</div>
    <!-- 권한 요청은 클릭에서만 띄운다. Safari는 사용자 제스처 없는
         Notification.requestPermission()을 아예 거부하고, 다른 브라우저도
         묻지 않은 요청은 조용히 차단하는 쪽으로 기운다. -->
    <button id="notify-btn" type="button" hidden>알림 켜기</button>
    <button id="logout-btn" type="button">로그아웃</button>
  </aside>
  <button id="sidebar-toggle" type="button" aria-controls="sidebar"
          aria-expanded="true" aria-label="사이드바 접기" title="사이드바 접기">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M10 3 5 8l5 5"></path>
    </svg>
  </button>
  <main id="terminal-pane">
    <div id="tab-bar" role="tablist" aria-label="열린 세션"></div>
    <div id="terminal-stack"></div>
    <!-- 폰 소프트 키보드에 없는 키들. 버튼은 app.js가 채운다. -->
    <div id="key-bar" role="toolbar" aria-label="터미널 특수키"></div>
    <div id="placeholder">좌측에서 프로젝트를 선택하세요.</div>
  </main>
  <div id="login-overlay">
    <form id="login-form">
      <h2>W-Term</h2>
      <!-- 인증에 쓰이지 않는다. 서버는 패스워드 하나만 보고 계정 개념 자체가 없다.
           비밀번호 관리자가 자격증명을 "아이디+패스워드" 쌍으로만 저장해서, 이 칸이
           없으면 저장할 때마다 아이디를 물어본다. 그 프롬프트를 없애는 라벨일 뿐이다. -->
      <input type="text" name="username" id="login-username" value="wterm"
             autocomplete="username" readonly hidden>
      <input type="password" name="password" id="login-password" placeholder="패스워드"
             autocomplete="current-password" required>
      <div id="login-error"></div>
      <button type="submit">로그인</button>
    </form>
  </div>
  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
